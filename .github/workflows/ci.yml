name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The root package.json declares npm workspaces (apps/*, packages/*)
      # whose `workspace:*` protocol npm cannot resolve. The bot + Express
      # dashboard need root deps only, so drop the field for this job.
      # (Next.js dashboard in apps/dashboard uses Bun/pnpm instead.)
      - run: node -e "const fs=require('fs');const p=require('./package.json');delete p.workspaces;fs.writeFileSync('package.json',JSON.stringify(p,null,2))"
      - run: npm ci
      - run: npm run build:commander
      - run: npm test
